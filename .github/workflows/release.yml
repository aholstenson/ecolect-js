name: Release

# Release Please keeps a release pull request up to date with the changelog and
# the next version. Merging that pull request tags a release, which then
# publishes the package to npm.
#
# The npm publish uses trusted publishing, so no npm token is stored here. The
# trusted publisher on npmjs.com must name this file, `release.yml`, as the
# workflow allowed to publish.

on:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets the job mint the OIDC token that npm trades for a short-lived
      # publish credential.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later. pnpm hands the publish
      # to npm, so the npm version on the runner is the one that counts.
      - name: Update npm
        run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci

      - run: pnpm publish --no-git-checks
